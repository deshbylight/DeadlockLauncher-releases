<!doctype html>
<!-- Data feed of the in-game skin picker (Docs/RuleBook/Launcher/Skins.md), renderer fork-0.1.89-dl8+.
     The window is native in the game's Esc menu (panorama/src/skins_window.ts): catalog and library tabs,
     cards with their own buttons. This page sits in a hidden HTML panel, reads GameBanana and the launcher
     on 127.0.0.1:<port>, and talks to the renderer:
       page -> renderer: document.title = "dlfeed:<id>:<part>:<parts>:<chunk>" (one JSON message, acked)
       renderer -> page: URL fragment "#<request>~<ack>~<party>~<command>~<arg>..." (no reload)
     Commands: heroes | shop~<cat>~<page>~<sort> | library | get~<mod> | wear~<mod> | off~<mod> |
               remove~<mod> | stock~<cat> | answer~<value>.
     Messages: ready, heroes, count, skins, card, ask, status, offline, apply, reset (panorama/src/skins_feed.ts).
     ?have=<mounted addon>: polls /current and reports a choice that differs from it.
     feed.html stays for renderer dl7, picker.html for dl4..dl6.
     Fork dl27 (mods, search, groups, updates, mod switch): feed2_more.js, loaded first.
     Fork dl52 (mod page, a get / delete per file): feed2_page.js, loaded second; get~<mod>~1 of a mod with several
     files opens its page.
     Launcher with the skins relay (D-352): the commands it lists on /ingame/skins/hello run in the launcher
     (ui/src/ingame_skins.ts, the Skins tab's modules); this page only forwards them and their messages. -->

<script>
'use strict'
const q = new URLSearchParams(location.search)
const PORT = Number(q.get('port')) || 27183
const LOCAL = 'http://127.0.0.1:' + PORT
const GB = 'https://gamebanana.com/apiv11'
const SKINS_CATEGORY = 33295
const CHUNK = 900
const ACK_TIMEOUT = 2000
// The Servers window: the list last posted (a poll skips it unchanged) and how long a command waits for a new one.
let srvSent = ''
const SRV_WAIT = 1500
const SORTS = { downloads: 'Generic_MostDownloaded', new: 'Generic_Newest', liked: 'Generic_MostLiked', views: 'Generic_MostViewed' }
const T = {
  ru: {
    window: { title: 'Скины', shop: 'Каталог', library: 'Установленные', close: 'Закрыть', cancel: 'Отмена',
      loading: 'Загрузка…', more: 'Ещё', empty: 'Пусто', get: 'Скачать', wear: 'Надеть', off: 'Снять',
      remove: 'Удалить', worn: 'Надет', sort: 'Сортировка:', sortDownloads: 'Скачивания', sortNew: 'Новые',
      sortLiked: 'Лайки', sortViews: 'Просмотры', nsfwHidden: '18+: скрыто', nsfwShown: '18+: показано',
      filterHeroes: 'Фильтр героев', filterSkins: 'Фильтр скинов (Enter: герой)',
      servers: 'Серверы', play: 'Играть', refresh: 'Обновить', full: 'Мест нет', onServer: 'Вы здесь', noServers: 'Открытых серверов нет' },
    launcher: 'Лаунчер', emptyAnswer: 'пустой ответ', badAnswer: 'неверный ответ',
    stock: 'Стандартный', offline: 'Лаунчер не запущен', pickFile: 'Выберите файл', pickVariant: 'Выберите вариант',
    failed: 'Ошибка: ', noFiles: 'нет файлов', removeAsk: 'Удалить «%s»?', downloading: 'Скачивание', unpacking: 'Распаковка…',
    connecting: 'Подключение: дальше в лаунчере', checking: 'Проверка…', applying: 'Надеваю…', removing: 'Удаляю…', starting: 'Запуск…',
    party: 'Вы в пати: выбор сохранён. Наденется, когда останетесь в хайдауте одни; в матчах — после перезапуска игры.',
  },
  en: {
    window: { title: 'Skins', shop: 'Catalog', library: 'Installed', close: 'Close', cancel: 'Cancel',
      loading: 'Loading…', more: 'More', empty: 'Empty', get: 'Download', wear: 'Wear', off: 'Take off',
      remove: 'Delete', worn: 'Worn', sort: 'Sort:', sortDownloads: 'Downloads', sortNew: 'Newest',
      sortLiked: 'Likes', sortViews: 'Views', nsfwHidden: '18+: hidden', nsfwShown: '18+: shown',
      filterHeroes: 'Filter heroes', filterSkins: 'Filter skins (Enter: hero)',
      servers: 'Servers', play: 'Play', refresh: 'Refresh', full: 'Full', onServer: 'You are here', noServers: 'No open servers' },
    launcher: 'Launcher', emptyAnswer: 'empty answer', badAnswer: 'bad answer',
    stock: 'Default', offline: 'The launcher is not running', pickFile: 'Choose a file', pickVariant: 'Choose a variant',
    failed: 'Error: ', noFiles: 'no files', removeAsk: 'Delete "%s"?', downloading: 'Downloading', unpacking: 'Unpacking…',
    connecting: 'Connecting: continued in the launcher', checking: 'Checking…', applying: 'Applying…', removing: 'Deleting…', starting: 'Starting…',
    party: 'You are in a party: choice saved. It goes on when you are alone in the hideout; in matches after a game restart.',
  },
}
// dl27 keys (feed2_more.js); a page without it still serves older renderers.
const HAS_MORE = typeof MORE !== 'undefined'
const HAS_PAGE = typeof sendPage === 'function'
if (HAS_MORE) for (const k of ['ru', 'en']) Object.assign(T[k].window, MORE_TEXT[k].window)
// dl58 library (feed2_lib.js): only for a renderer that asked with v=2.
const HAS_LIB = typeof LIB !== 'undefined' && LIB
if (HAS_LIB) for (const k of ['ru', 'en']) Object.assign(T[k].window, LIB_TEXT[k].window)
// dl59 picks and groups in game (feed2_pick.js): only for a renderer that asked with v=3.
const HAS_PICK = typeof PICK !== 'undefined' && PICK
if (HAS_PICK) for (const k of ['ru', 'en']) Object.assign(T[k].window, PICK_TEXT[k].window)
let L = T.ru

// ---- channel to the renderer ----
const queue = []      // { key, seq, json } waiting; queue[0] is `current` while it is sent
let current = null    // { id, parts, at, timer }
let ids = 0
let ack = ''
let party = false
let lastRequest = 0

// boot + seq name each message once: a resend after ACK_TIMEOUT goes out under a new title id, and a renderer
// that read the first copy but acked late would show it twice (a second "ask" reopened the dialog after the answer,
// owner 2026-11-23). Renderers from fork dl18 drop a seq they saw; older ones ignore both fields.
const boot = Date.now().toString(36)
let seq = 0
// A download posts its card at every percent; each message waits for the renderer's ack, so the cards queued up and
// the answers to the player's clicks (other hero, tab, page) came seconds late: the window looked frozen while a
// progress bar ran (owner 2026-11-23). A card still waiting is replaced by the newer one of the same skin; it keeps
// its seq, so the order the renderer checks stays.
function post(message) {
  const key = message.kind === 'card' ? message.skin.mod + ':' + message.skin.cat + ':' + (message.skin.file || '')
    : message.kind === 'page' ? 'page:' + message.page.mod : ''
  const waiting = key ? queue.findIndex((q, i) => q.key === key && !(i === 0 && current)) : -1
  if (waiting >= 0) {
    const old = queue[waiting]
    old.json = JSON.stringify({ ...message, boot, seq: old.seq })
    return
  }
  queue.push({ key, seq: ++seq, json: JSON.stringify({ ...message, boot, seq }) })
  if (!current) next()
}
function next() {
  if (!queue.length) { current = null; return }
  const json = queue[0].json
  const parts = []
  for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK))
  if (!parts.length) parts.push('')
  current = { id: Date.now().toString(36) + (ids++), parts, at: 0, timer: 0 }
  part()
}
function part() {
  const c = current
  clearTimeout(c.timer)
  document.title = 'dlfeed:' + c.id + ':' + c.at + ':' + c.parts.length + ':' + c.parts[c.at]
  // No ack in time: the whole message again under a new id (a new title).
  c.timer = setTimeout(() => { if (current === c) next() }, ACK_TIMEOUT)
}
function acked(key) {
  const c = current
  if (!c || key !== c.id + '.' + c.at) return
  clearTimeout(c.timer)
  if (++c.at < c.parts.length) return part()
  queue.shift()
  next()
}
function readFragment() {
  const f = location.hash.slice(1)
  if (!f) return
  const [req, key, p, cmd, ...args] = f.split('~')
  party = p === '1'
  if (key && key !== ack) { ack = key; acked(key) }
  const n = Number(req)
  if (n > lastRequest && cmd) {
    lastRequest = n
    run(cmd, args.map(decodeURIComponent)).catch((e) => status(L.failed + e.message))
  }
}
window.addEventListener('hashchange', readFragment)
setInterval(readFragment, 100)

const status = (text) => post({ kind: 'status', text })

// ---- launcher and GameBanana ----
// Answers are read as text first: an empty or cut body used to surface as the bare "Unexpected end of JSON input"
// (owner 2026-11-23) with no hint of which request failed.
async function readJson(r, what) {
  const text = await r.text()
  let body
  try { body = JSON.parse(text) } catch (e) {
    throw new Error(what + ': ' + (text ? L.badAnswer : L.emptyAnswer) + ' (HTTP ' + r.status + ')')
  }
  if (!r.ok) throw new Error(what + ': ' + ((body && body.error) || 'HTTP ' + r.status))
  return body
}
async function local(path) {
  return readJson(await fetch(LOCAL + path), L.launcher + ' ' + path.split('?')[0])
}
// GameBanana cache (owner 2026-11-24: in game each list loaded only when opened). Answers are kept in memory and in
// localStorage (persistence across game starts in the game's CEF: unverified); warm() fills it right after the page
// loads, long before the Esc window opens. Same ages as the launcher (skins_gb.ts AGE): lists 30 min, categories
// 1 day, ProfilePage (ratings) 7 days; library() passes 0 for its fresh update check.
const DAY = 86400000
const CACHE = 'dlgb:'
const mem = new Map()      // path -> { t, d }
const inflight = new Map() // path -> Promise, shared by warm() and a click on the same list
function ageOf(path) {
  if (path.includes('/ProfilePage')) return 7 * DAY
  if (path.includes('Categor')) return DAY
  return DAY / 48
}
// Only the fields this page reads (a ProfilePage is tens of KB); same list as the launcher's skins_cache.ts.
const REC_KEYS = ['_idRow', '_sName', '_sProfileUrl', '_nLikeCount', '_bHasContentRatings', '_aContentRatings',
  '_aRootCategory', '_aSubCategory', '_aCategory', '_tsDateUpdated', '_tsDateModified', '_sVersion', '_nViewCount',
  '_nDownloadCount']
/** The description as plain text, cut for the in-game page (feed2_page.js). */
function plainText(html) {
  const ent = { nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }
  return String(html).replace(/<br\s*\/?>|<\/(p|div|li|h\d)>/gi, '\n').replace(/<[^>]*>/g, '')
    .replace(/&(nbsp|amp|lt|gt|quot|#39);/g, (_, k) => ent[k]).replace(/[ \t]+/g, ' ').replace(/\n\s*\n\s*\n+/g, '\n\n')
    .trim().slice(0, 700)
}
const FILE_KEYS = ['_idRow', '_sFile', '_nFilesize', '_sDescription', '_sAvResult', '_sAnalysisResult', '_tsDateAdded', '_sMd5Checksum']
function pick(o, keys) {
  const out = {}
  for (const k of keys) if (o[k] !== undefined) out[k] = o[k]
  return out
}
function slimRec(r) {
  const out = pick(r, REC_KEYS)
  const im = r._aPreviewMedia && r._aPreviewMedia._aImages
  if (im && im.length) out._aPreviewMedia = { _aImages: im.slice(0, 1) }
  if (Array.isArray(r._aFiles)) out._aFiles = r._aFiles.map((f) => pick(f, FILE_KEYS))
  if (r._aSubmitter && r._aSubmitter._sName) out._aSubmitter = { _sName: r._aSubmitter._sName }
  if (typeof r._sText === 'string') out._sText = plainText(r._sText)
  return out
}
function slim(d) {
  if (Array.isArray(d) || !d || typeof d !== 'object') return d
  if (Array.isArray(d._aRecords)) return { _aRecords: d._aRecords.map(slimRec), _aMetadata: d._aMetadata }
  return '_idRow' in d ? slimRec(d) : d
}
function cacheGet(path) {
  let e = mem.get(path)
  if (!e) {
    try { e = JSON.parse(localStorage.getItem(CACHE + path) || 'null') } catch (err) { e = null }
    if (e) mem.set(path, e)
  }
  return e
}
function cachePut(path, d) {
  const e = { t: Date.now(), d }
  mem.set(path, e)
  try { localStorage.setItem(CACHE + path, JSON.stringify(e)) } catch (err) {
    // Full store: drop this page's entries and keep the memory copy (no retry loop).
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i)
      if (k && k.startsWith(CACHE)) localStorage.removeItem(k)
    }
  }
}
async function gb(path, maxAge) {
  const age = maxAge === undefined ? ageOf(path) : maxAge
  const e = age > 0 ? cacheGet(path) : null
  if (e && Date.now() - e.t <= age) return e.d
  if (inflight.has(path)) return inflight.get(path)
  const p = (async () => {
    try {
      const d = slim(await readJson(await fetch(GB + path), 'GameBanana ' + path.split('?')[0]))
      cachePut(path, d)
      return d
    } finally { inflight.delete(path) }
  })()
  inflight.set(path, p)
  return p
}
/** After load: heroes, mod categories and the first page (most downloaded) of every hero with its 18+ lookups. */
async function warm() {
  await loadHeroes()
  if (HAS_MORE) await loadModCats()
  const cats = heroes.filter((h) => h.code).map((h) => h.cat)
  let next = 0
  const worker = async () => {
    while (next < cats.length) {
      const cat = cats[next++]
      try {
        const res = await gb('/Mod/Index?_nPerpage=24&_nPage=1&_aFilters%5BGeneric_Category%5D=' + cat + '&_sSort=' + SORTS.downloads)
        await shownOf(res._aRecords || [])
      } catch (e) { /* this list loads (and reports its error) when the window asks for it */ }
    }
  }
  await Promise.all([worker(), worker(), worker()])
}
const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '')
function thumb(rec) {
  const im = rec._aPreviewMedia && rec._aPreviewMedia._aImages && rec._aPreviewMedia._aImages[0]
  return im ? im._sBaseUrl + '/' + (im._sFile220 || im._sFile) : ''
}

let state = null   // launcher /state
let heroes = null  // [{cat, code, name}]
let asking = null  // resolver of the open ask
const info = {}    // mod -> { name, image, cat } seen in the catalog or read for the library
const busy = {}    // mod -> line of the running action
let view = 'shop'  // last list the window asked for

async function loadState() {
  const prev = state && state.modsOn
  state = await local('/state')
  L = state.en ? T.en : T.ru
  if (HAS_MORE && prev) modsFlipped(prev)
}
async function loadHeroes() {
  if (!state) await loadState()
  if (heroes) return
  const byEn = {}
  for (const [code, name] of Object.entries(state.namesEn)) byEn[norm(name)] = code
  const cats = await gb('/Mod/Categories?_idCategoryRow=' + SKINS_CATEGORY + '&_sSort=a_to_z&_bShowEmpty=true')
  heroes = cats.filter((c) => !c._bIsObsolete).map((c) => {
    const code = byEn[norm(c._sName)] || null
    return { cat: c._idRow, code, name: (code && state.names[code]) || c._sName }
  }).sort((a, b) => a.name.localeCompare(b.name))
}
function sendHeroes() {
  post({ kind: 'heroes', heroes: heroes.map((h) => ({ cat: h.cat, name: h.name, chosen: !!(h.code && state.selected[h.code]),
    ...(HAS_LIB && h.code ? { icon: heroIcon(h.code) } : {}) })) })
}
const installedMods = () => [...new Set(state.installed.map((s) => s.gbMod).concat(HAS_MORE ? modsMine() : []).filter((m) => m))]
const sendCount = () => post({ kind: 'count', count: installedMods().length })

function ask(title, options) {
  if (asking) asking(null)
  return new Promise((done) => {
    asking = (value) => { asking = null; done(value) }
    post({ kind: 'ask', title, options: options.map((label, i) => ({ label, value: String(i) })) })
  })
}

// ---- cards ----
// NSFW guard (launcher setting nsfwGuard, default on, owner 2026-11-22): 18+ mods are left out of the catalog here;
// the launcher leaves 18+ skins out of /state and refuses to install or wear them.
const guarded = () => !state || state.nsfwGuard !== false
// GameBanana content-rating keys that make a mod 18+ (skins_nsfw.rs NSFW_RATINGS; `cp` crude language does not).
const NSFW_RATINGS = ['st', 'sc', 'sa', 'lp', 'pn', 'nu']
/** ProfilePage ratings -> 18+; an Index record with only _bHasContentRatings -> undefined (read its ProfilePage). */
function adultOf(rec) {
  const r = rec._aContentRatings
  if (r !== undefined) return !Array.isArray(r) && Object.keys(r).some((k) => NSFW_RATINGS.includes(k))
  return rec._bHasContentRatings === true ? undefined : false
}
/** Index records without the 18+ ones (an unreadable rating counts as 18+). */
async function shownOf(recs) {
  if (!guarded()) return recs
  const adult = await Promise.all(recs.map(async (rec) => {
    const a = adultOf(rec)
    if (a !== undefined) return a
    try { return adultOf(await gb('/Mod/' + rec._idRow + '/ProfilePage')) !== false } catch (e) { return true }
  }))
  return recs.filter((_, i) => !adult[i])
}
function cardOf(mod) {
  const mine = state.installed.filter((s) => s.gbMod === mod)
  const worn = mine.some((s) => state.selected[s.hero] === s.id)
  const i = info[mod] || {}
  // dl27: installed non-hero mods are "mine" too, with their kind, switch, update, likes and tag.
  const more = HAS_MORE ? cardMore(mod) : {}
  const rows = HAS_MORE ? modRows(mod) : []
  // A mod of one hero (a voice or model mod, launcher row "hero") names it like a skin (owner 2026-11-25: Vivian
  // Banshee showed no hero and looked like a second skin); a mod of no hero shows none.
  const code = (mine[0] && mine[0].hero) || (rows.find((r) => r.hero) || {}).hero
  const hero = code ? (state.names[code] || code)
    : more.kind === 'mod' ? '' : ((heroes || []).find((h) => h.cat === i.cat) || {}).name || ''
  const name = i.name || (mine[0] && mine[0].name) || (rows[0] && rows[0].name) || String(mod)
  return { mod, cat: 0, name, image: i.image || '', hero,
    worn, mine: mine.length > 0 || rows.length > 0, busy: busy[mod] || '', ...more }
}
function stockOf(hero) {
  return { mod: 0, cat: hero.cat, name: L.stock, image: '', hero: hero.name, worn: !state.selected[hero.code],
    mine: false, busy: '' }
}
const sendCard = (mod) => post({ kind: 'card', skin: cardOf(mod) })
function setBusy(mod, text) {
  if (text) busy[mod] = text
  else delete busy[mod]
  sendCard(mod)
  if (HAS_PAGE && pageMod === mod) sendPage()
}
/** After a choice: the cards of the heroes whose skin changed, the heroes' marks. */
function sendChoice(before) {
  const changed = new Set()
  for (const code of new Set([...Object.keys(before), ...Object.keys(state.selected)])) {
    if (before[code] === state.selected[code]) continue
    for (const id of [before[code], state.selected[code]]) {
      const s = id && state.installed.find((x) => x.id === id)
      if (s) changed.add(s.gbMod)
    }
    const hero = heroes.find((h) => h.code === code)
    if (hero) post({ kind: 'card', skin: stockOf(hero) })
  }
  for (const mod of changed) sendCard(mod)
  sendHeroes()
}

async function library() {
  const mods = installedMods()
  // dl27: each open reads every ProfilePage fresh, for the update mark (the app's skins_update.ts).
  await Promise.all(mods.filter((m) => HAS_MORE || !info[m] || !info[m].image).map(async (m) => {
    try {
      const p = await gb('/Mod/' + m + '/ProfilePage', 0)
      const skin = state.installed.some((s) => s.gbMod === m)
      info[m] = HAS_MORE ? recInfo(p, skin ? (p._aCategory && p._aCategory._idRow) : 0, skin ? 'skin' : 'mod')
        : { name: p._sName, image: thumb(p), cat: p._aCategory && p._aCategory._idRow }
      if (HAS_MORE) noteUpdate(m, p)
    } catch (e) { /* the card keeps the stored name, no preview */ }
  }))
  // Skins and hero mods by hero first, then mods of no hero by name.
  const rank = (c) => (c.kind === 'mod' && !c.hero ? 1 : 0)
  let skins = mods.map(cardOf).sort((a, b) => rank(a) - rank(b) || a.hero.localeCompare(b.hero) || (b.worn - a.worn) || a.name.localeCompare(b.name))
  if (HAS_LIB) skins = await libraryFound(skins)
  post({ kind: 'skins', view: 'library', cat: 0, sort: '', page: 1, complete: true, skins })
  if (HAS_MORE) sendGroups()
}

async function run(cmd, args) {
  // Launcher 0.5.x+ (D-352): the commands it registered run on the launcher's Skins tab modules (ingame_skins.ts).
  if (relay.cmds && relay.cmds.has(cmd)) {
    await local('/ingame/skins/do?cmd=' + encodeURIComponent(cmd) + '&args=' + encodeURIComponent(JSON.stringify(args)) +
      '&party=' + (party ? 1 : 0) + '&v=' + V)
    return
  }
  if (cmd === 'answer') {
    if (asking) asking(args[0] === '' ? null : Number(args[0]))
    return
  }
  if (cmd === 'heroes') {
    try {
      await loadState()
    } catch (e) {
      return post({ kind: 'offline', text: T.ru.offline + ' / ' + T.en.offline })
    }
    await loadHeroes()
    sendCount()
    post({ kind: 'nsfw', on: guarded() })
    sendHeroes()
    if (HAS_MORE) sendGroups()
    return
  }
  if (cmd === 'nsfw') {
    // The window's 18+ toggle; it asks for its list again on the answer.
    await local('/nsfw?on=' + (args[0] === '1' ? '1' : '0'))
    await loadState()
    sendCount()
    post({ kind: 'nsfw', on: guarded() })
    sendHeroes()
    return check()
  }
  if (cmd === 'servers') {
    // In-game Servers view (owner 2026-11-23): the launcher's Servers rows (servers_ingame.rs).
    const l = await local('/servers')
    return post({ kind: 'servers', servers: l.servers || [], blocked: l.blocked || '' })
  }
  if (cmd === 'srvlist') {
    // Fork dl19+ Servers window: the whole window the launcher built (ingame_servers.ts: rows, filters, own run, texts).
    // dl56+ polls as "srvlist poll": an unchanged list is not sent again (each one is several title parts, each
    // waiting for its ack, and a click's answer queued behind them; owner 2026-11-25: heavy lag).
    const list = await local('/servers')
    const text = JSON.stringify(list)
    if (args[0] === 'poll' && text === srvSent) return
    srvSent = text
    return post({ kind: 'srvlist', list })
  }
  if (cmd === 'srvdo') {
    // Fork dl19+: a window command (join / leave / host / pref) for the launcher UI (servers_ingame.rs command).
    const before = JSON.stringify(await local('/servers'))
    await local('/servers/do?cmd=' + encodeURIComponent(args[0] || '') + '&arg=' + encodeURIComponent(args.slice(1).join(' ')))
    // The launcher UI runs the command and pushes its new list after the call returns: sent as soon as it changed
    // (was a fixed 400 ms), at most SRV_WAIT for a command that changes nothing now (join, copy).
    let list = await local('/servers')
    for (let waited = 0; JSON.stringify(list) === before && waited < SRV_WAIT; waited += 50) {
      await new Promise((r) => setTimeout(r, 50))
      list = await local('/servers')
    }
    srvSent = JSON.stringify(list)
    return post({ kind: 'srvlist', list })
  }
  if (cmd === 'srvjoin') {
    await local('/servers/join?code=' + encodeURIComponent(args[0] || ''))
    return status(L.connecting)
  }
  if (!state || !heroes) await loadHeroes()
  if (cmd === 'library') {
    view = 'library'
    await loadState()
    return library()
  }
  if (HAS_PICK && PICK_CMDS[cmd]) return PICK_CMDS[cmd](args)
  if (HAS_LIB && LIB_CMDS[cmd]) return LIB_CMDS[cmd](args)
  if (HAS_MORE && MORE[cmd]) return MORE[cmd](args)
  if (cmd === 'shop') {
    view = 'shop'
    const cat = Number(args[0])
    const page = Math.max(1, Number(args[1]) || 1)
    const sort = SORTS[args[2]] ? args[2] : 'downloads'
    const hero = heroes.find((h) => h.cat === cat)
    // dl27: a query searches every hero; the "updated" order; likes on the cards.
    if (HAS_MORE && (hero || args[3])) return catalog('shop', cat, page, args[2] || 'downloads', args[3] || '')
    if (!hero) return
    const res = await gb('/Mod/Index?_nPerpage=24&_nPage=' + page + '&_aFilters%5BGeneric_Category%5D=' + cat + '&_sSort=' + SORTS[sort])
    const skins = []
    if (page === 1 && hero.code) skins.push(stockOf(hero))
    for (const rec of await shownOf(res._aRecords || [])) {
      info[rec._idRow] = { name: rec._sName, image: thumb(rec), cat }
      skins.push(cardOf(rec._idRow))
    }
    return post({ kind: 'skins', view: 'shop', cat, sort: args[2] || 'downloads', page, complete: !!(res._aMetadata && res._aMetadata._bIsComplete), skins })
  }
  if (cmd === 'stock') {
    const hero = heroes.find((h) => h.cat === Number(args[0]))
    if (!hero || !hero.code) return
    try {
      await choose([[hero.code, '']])
    } finally {
      post({ kind: 'card', skin: stockOf(hero) })
    }
    return
  }
  const mod = Number(args[0])
  if (!mod) return
  try {
    if (cmd === 'get') await get(mod, args[1] === '1')
    else if (cmd === 'wear') await wear(mod)
    else if (cmd === 'off') await choose(state.installed.filter((s) => s.gbMod === mod && state.selected[s.hero] === s.id).map((s) => [s.hero, '']))
    else if (cmd === 'remove') await remove(mod)
  } finally {
    // Every end (done, cancelled, failed) gives the card its buttons back.
    if (busy[mod] !== undefined) delete busy[mod]
    sendCard(mod)
  }
}

/** get installs a file of mod; `paged` (fork dl52 card): several files open the mod page, one get per file there. */
async function get(mod, paged) {
  if (state.installed.some((s) => s.gbMod === mod)) return
  const prof = await gb('/Mod/' + mod + '/ProfilePage')
  if (!info[mod]) info[mod] = { name: prof._sName, image: thumb(prof), cat: prof._aCategory && prof._aCategory._idRow }
  const files = (prof._aFiles || []).filter((f) => /\.(zip|rar|7z|vpk)$/i.test(f._sFile) && f._sAvResult === 'clean')
  if (!files.length) throw new Error(L.noFiles)
  if (paged && HAS_PAGE && files.length > 1) return openPage(mod)
  let file = files[0]
  if (files.length > 1) {
    const i = await ask(L.pickFile, files.map((f) => f._sFile + (f._sDescription ? ' — ' + f._sDescription : '') + ' (' + Math.round(f._nFilesize / 1048576) + ' MB)'))
    if (i === null) return
    file = files[i]
  }
  setBusy(mod, L.starting)
  let shown = ''
  const poll = setInterval(async () => {
    try {
      const p = await local('/progress?mod=' + mod)
      const line = p.stage === 'download' ? L.downloading + (p.total ? ' ' + Math.min(100, Math.floor(p.done * 100 / p.total)) + '%' : '…')
        : p.stage === 'unpack' ? L.unpacking : p.stage === 'check' ? L.checking : ''
      if (line && line !== shown && busy[mod]) { shown = line; setBusy(mod, line) }
    } catch (e) { /* the install answer reports a dead launcher */ }
  }, 400)
  try {
    await local('/install?mod=' + mod + '&file=' + file._idRow)
  } finally {
    clearInterval(poll)
  }
  await loadState()
  sendCount()
}

async function wear(mod) {
  const skins = state.installed.filter((s) => s.gbMod === mod)
  if (!skins.length) return
  let skin = skins[0]
  if (skins.length > 1) {
    const i = await ask(L.pickVariant, skins.map((s) => s.name))
    if (i === null) return
    skin = skins[i]
  }
  setBusy(mod, L.applying)
  await choose([[skin.hero, skin.id]])
}

async function remove(mod) {
  const i = await ask(L.removeAsk.replace('%s', cardOf(mod).name), [L.window.remove])
  if (i === null) return
  setBusy(mod, L.removing)
  const before = { ...state.selected }
  await local('/remove?mod=' + mod)
  delete busy[mod]
  await loadState()
  sendCount()
  if (view === 'library') await library()
  sendChoice(before)
  await check()
}

/** choose sets each [hero, id] (empty id = stock), then reports the new addon. */
async function choose(list) {
  if (!list.length) return
  const before = { ...state.selected }
  for (const [code, id] of list) {
    await local('/select?hero=' + encodeURIComponent(code) + '&id=' + encodeURIComponent(id))
  }
  await loadState()
  sendChoice(before)
  // In a party the renderer loads nothing (shared Party Hideout); the marks show the saved choice.
  if (party) status(L.party)
  await check()
}

// ---- launcher relay (D-352, ingame_skins.rs) ----
// /ingame/skins/hello names the commands the launcher UI runs and its window text; their messages come back on a
// long poll of /ingame/skins/out and go to the renderer through post() unchanged. Kind `check` is this page's:
// re-read /current now. No relay (older launcher, UI not loaded yet, launcher closed): the page's own code runs every
// command and hello is asked again every 3 s. Commands the launcher does not list (servers, picks) always stay here.
const V = Number(q.get('v')) || 1
const relay = { cmds: null, boot: '', after: 0, text: {} }
async function hello() {
  try {
    const h = await local('/ingame/skins/hello')
    relay.boot = h.boot
    relay.after = h.last || 0
    relay.text = h.text || {}
    relay.cmds = (h.cmds || []).length ? new Set(h.cmds) : null
  } catch (e) {
    relay.cmds = null
  }
  if (relay.cmds) post({ kind: 'ready', text: Object.assign({}, L.window, relay.text) })
}
async function relayLoop() {
  for (;;) {
    if (!relay.cmds) {
      await new Promise((done) => setTimeout(done, 3000))
      await hello()
      continue
    }
    let r
    try {
      r = await local('/ingame/skins/out?after=' + relay.after)
    } catch (e) {
      relay.cmds = null
      continue
    }
    // Another launcher run: its queue and UI state are new.
    if (r.boot !== relay.boot) { await hello(); continue }
    for (const x of r.msgs || []) {
      relay.after = x.id
      if (x.m.kind === 'check') check()
      else post(x.m)
    }
  }
}

// ---- the choice the launcher holds versus the mounted addon ----
let have = q.get('have') || ''
let offline = false
async function check() {
  try {
    const cur = await local('/current')
    const now = cur.addon || ''
    offline = false
    // The launcher's language (launcher 0.5.25+): a page started before the launcher sent Russian, and the player
    // may switch it; the window takes the new text (owner 2026-11-25: windows in two languages).
    if (typeof cur.en === 'boolean' && (cur.en ? T.en : T.ru) !== L) {
      L = cur.en ? T.en : T.ru
      if (state) state.en = cur.en
      // Relay: the launcher UI reloaded in the new language and registered its new text.
      if (relay.cmds) await hello()
      else post({ kind: 'ready', text: L.window })
    }
    if (now !== have) {
      post(now ? { kind: 'apply', addon: now } : { kind: 'reset' })
      have = now
    }
  } catch (e) {
    if (!offline) post({ kind: 'offline', text: L.offline })
    offline = true
  }
}

async function start() {
  try { await loadState() } catch (e) { /* offline: Russian text, check() reports it */ }
  await hello()
  if (!relay.cmds) post({ kind: 'ready', text: L.window })
  if (state) sendCount()
  // A failed warm-up is not reported: each list reads (and reports) itself when the window asks for it. Under the
  // relay the launcher's own cache serves the lists.
  if (state && !relay.cmds) warm().catch(() => {})
  relayLoop()
  for (;;) {
    await check()
    await new Promise((done) => setTimeout(done, 3000))
  }
}
start()
</script>
