<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dlviewer</title>
<!-- In-game 3D preview of a skin (fork skins window, 3D button). Script: viewer.js, built from
     Apps/Launcher/ui/pages/viewer_page.ts by scripts/build-viewer.mjs. -->
<style>
  html, body { margin: 0; height: 100%; background: #0a0c09; overflow: hidden; }
  .skin-viewer { position: absolute; inset: 0; }
  .skin-viewer canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #ffefd7cc;
    font: 600 18px/1.3 sans-serif; z-index: 1; padding: 0 16px; }
</style>
</head>
<body>
<div id="status"></div>
<script src="viewer.js"></script>
</body>
</html>
